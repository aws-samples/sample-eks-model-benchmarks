{{- /*
Inline secrets are a BOOTSTRAP convenience only. The recommended path is to
reference pre-created secrets via database.existingSecret / huggingface.existingSecret
(e.g. the Terraform-provisioned `accelbench-db`), so credentials are not rendered
into the Helm release and visible via `helm get manifest`.
*/ -}}
{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "accelbench.dbSecretName" . }}
  namespace: {{ include "accelbench.namespace" . }}
  labels:
    {{- include "accelbench.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ include "accelbench.databaseURL" . | quote }}
{{- end }}
{{- if and .Values.huggingface.token (not .Values.huggingface.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "accelbench.hfSecretName" . }}
  namespace: {{ include "accelbench.namespace" . }}
  labels:
    {{- include "accelbench.labels" . | nindent 4 }}
type: Opaque
stringData:
  HF_TOKEN: {{ .Values.huggingface.token | quote }}
{{- end }}
