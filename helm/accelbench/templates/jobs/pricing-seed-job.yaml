{{- if .Values.pricingRefresh.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "accelbench.fullname" . }}-pricing-seed
  namespace: {{ include "accelbench.namespace" . }}
  labels:
    {{- include "accelbench.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "accelbench.api.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "accelbench.podSecurityContext" . | nindent 8 }}
      containers:
        - name: pricing-seed
          image: "{{ include "accelbench.image" (dict "service" "api" "Values" .Values "Chart" .Chart) }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          securityContext:
            {{- include "accelbench.containerSecurityContext" . | nindent 12 }}
          command: ["/pricingrefresh"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "accelbench.dbSecretName" . }}
                  key: {{ .Values.database.existingSecretKey | default "DATABASE_URL" }}
            - name: PRICING_REGIONS
              value: {{ .Values.pricingRefresh.regions | default "us-east-2" | quote }}
          resources:
            {{- toYaml .Values.pricingRefresh.resources | nindent 12 }}
{{- end }}
