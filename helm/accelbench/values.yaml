# -- Global settings
# Namespace to deploy into. Leave empty to use the release namespace (the
# namespace passed to `helm install --namespace ...`), which is the idiomatic
# Helm behaviour. Set explicitly only if you need to pin a namespace
# independently of the release namespace (kept for backward compatibility).
namespace: "accelbench"

# -- Create the namespace as part of the release. Off by default because the
# recommended flow provisions the namespace via Terraform (or `helm install
# --create-namespace`). Set true for a self-contained install that owns its
# namespace. Only takes effect when it differs from the release namespace.
createNamespace: false

# -- Override the generated name of chart objects.
nameOverride: ""
fullnameOverride: ""

# -- Container images
# Defaults point to the public ECR registry with the chart's appVersion as tag.
# Override image.registry to use a private registry for development, or set
# individual image.<service>.repository / tag for fine-grained control.
image:
  # -- Base registry for all images. Individual repository fields default to
  # <registry>/accelbench-<service>. Override per-service repository to point
  # at a completely different location (e.g. a private dev ECR).
  registry: "public.ecr.aws/aws-containers"
  # -- Default tag for all images. Uses Chart appVersion when empty.
  tag: ""
  api:
    repository: ""  # Default: <registry>/accelbench-api
    tag: ""         # Default: appVersion
    # Tags default to the immutable appVersion, so IfNotPresent avoids a
    # needless registry round-trip (and pull failure mode) on every restart.
    pullPolicy: IfNotPresent
  web:
    repository: ""  # Default: <registry>/accelbench-web
    tag: ""         # Default: appVersion
    pullPolicy: IfNotPresent
  tools:
    repository: ""  # Default: <registry>/accelbench-tools
    tag: ""         # Default: appVersion
    pullPolicy: IfNotPresent
  loadgen:
    # Our ECR fork of inference-perf that adds sentencepiece
    # (see docker/Dockerfile.inference-perf). Set when you need Mistral
    # / older-Llama / T5-family SentencePiece tokenizer support. Leave
    # empty to fall back to upstream quay.io/inference-perf/inference-
    # perf:<tool_versions.inference_perf_version>.
    repository: ""  # Default: <registry>/accelbench-loadgen
    tag: ""         # Default: appVersion
  vllm:
    # Optional full override for the vLLM model container image.
    # When repository is set, Helm passes VLLM_IMAGE=<repository>:<tag>
    # to the API pod, which the orchestrator uses verbatim — bypassing
    # the Docker-Hub / ECR pull-through cache template path. Leave empty
    # to compose the URI from tool_versions.framework_version.
    repository: ""
    tag: "latest"
  migration:
    repository: ""  # Default: <registry>/accelbench-migration
    tag: ""         # Default: appVersion
    pullPolicy: IfNotPresent
  cacheJob:
    repository: ""  # Default: <registry>/accelbench-cache-job
    tag: ""         # Default: appVersion

imagePullSecrets: []

# -- Pod-level security context applied to all workloads. Overridable.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context applied to all workloads. Overridable.
# readOnlyRootFilesystem is left off by default because some containers write
# to the filesystem (nginx cache, tooling); enable per-workload once verified.
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- API server
api:
  replicaCount: 2
  port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # -- Spread the 2 replicas across nodes. Set to [] to disable.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: accelbench-api
  # -- PodDisruptionBudget for the API deployment.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # -- Service account for API (IRSA)
  serviceAccount:
    create: true
    name: accelbench-api
    annotations: {}
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/accelbench-api

# -- RBAC: the API server needs permissions to manage benchmark workloads
rbac:
  create: true

# -- Web frontend (nginx)
web:
  replicaCount: 2
  port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: accelbench-web
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # -- nginx listens on port 80, so the web pod does NOT force runAsNonRoot
  # (unlike the strict global default used by the API). These override the
  # global podSecurityContext / containerSecurityContext for the web pod only.
  #
  # The stock nginx:alpine image starts its master process as root, then drops
  # workers to the `nginx` user via setuid. That handoff needs CHOWN + SETUID +
  # SETGID (plus NET_BIND_SERVICE to bind port 80). Dropping ALL with only
  # NET_BIND_SERVICE makes nginx exit immediately — so we drop ALL and add back
  # exactly the four it needs.
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - CHOWN
        - SETGID
        - SETUID
        - NET_BIND_SERVICE

# -- Extra service accounts for benchmark workloads (loadgen / model / cache
# jobs). These run in the accelbench namespace and typically need IRSA / Pod
# Identity roles for S3 (results, model weights) and Secrets Manager (HF token).
# Set create=false on a brownfield cluster where they already exist.
serviceAccounts:
  loadgen:
    create: true
    name: accelbench-loadgen
    annotations: {}
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/accelbench-loadgen
  model:
    create: true
    name: accelbench-model
    annotations: {}
  cacheJob:
    create: true
    name: accelbench-cache-job
    annotations: {}

# -- Public HTTPS ingress (PRD-43a). Disabled by default — port-forward works
# out of the box. Set enabled=true, host, and tls.source to stand up a public
# URL via the AWS Load Balancer Controller. See terraform/README.md for the
# three supported modes and the end-to-end install flow.
ingress:
  enabled: false
  host: ""
  tls:
    # One of: acm-route53, acm-existing, none.
    #   acm-route53:  Terraform creates + validates an ACM cert; populate
    #                 certificateArn from `terraform output -raw certificate_arn`.
    #   acm-existing: You already have an ACM cert ARN to use.
    #   none:         HTTP only — dev/CI clusters. Not for production.
    source: "none"
    certificateArn: ""

# -- Database (Aurora PostgreSQL)
database:
  # -- RECOMMENDED: reference an existing Kubernetes secret holding a
  # pre-encoded DATABASE_URL (this is what Terraform provisions as
  # `accelbench-db`). Using existingSecret sidesteps all password-encoding
  # concerns because the URL is built and encoded outside the chart.
  existingSecret: "accelbench-db"
  existingSecretKey: "DATABASE_URL"
  # -- Full connection string, used VERBATIM when set. You must percent-encode
  # the password yourself. Format:
  #   postgres://user:password@host:port/dbname?sslmode=require
  url: ""
  # -- Component fields — used only when both existingSecret and url are empty.
  # The chart assembles the DSN and percent-encodes `password` automatically.
  host: ""
  port: 5432
  name: accelbench
  username: accelbench
  password: ""
  sslmode: require

# -- Database migration job
migration:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# -- Pricing refresh CronJob
pricingRefresh:
  enabled: true
  schedule: "0 3 * * *"  # Daily at 03:00 UTC
  regions: "us-east-1,us-east-2,us-west-1,us-west-2,eu-west-1,eu-west-2,eu-central-1,ap-southeast-1,ap-northeast-1"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -- Catalog refresh CronJob. Nudges the API's /api/v1/catalog/seed endpoint;
# the seeder itself runs in-process in the API (PRD-30). Runs on a node labeled
# accelbench/node-type=system.
catalogSeed:
  enabled: true
  schedule: "0 2 * * 0"  # Weekly: Sunday at 02:00 UTC
  image: "curlimages/curl:8.11.0"
  nodeSelector:
    accelbench/node-type: system
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

# -- HuggingFace token (optional, for gated model access)
# PRD-31: Prefer setting this via the Configuration page (/configuration) once
# the API is running. The page stores the token in AWS Secrets Manager at
# accelbench/config/hf-token and auto-injects it into benchmark runs, cache
# jobs, and catalog seeds. The values below are kept as a bootstrap path for
# clusters that want to pre-configure before first boot.
huggingface:
  token: ""
  existingSecret: ""
  existingSecretKey: "HF_TOKEN"

# -- Benchmark results storage (S3)
results:
  # -- S3 bucket name for storing loadgen results (avoids log truncation)
  # Set from Terraform output: accelbench-results-<account-id>
  s3Bucket: ""

# -- Model weights storage (S3)
models:
  # -- S3 bucket name for cached/custom model weights (Run:ai Streamer)
  # Set from Terraform output: accelbench-models-<account-id>
  s3Bucket: ""

# -- Cognito auth (PRD-43). Populate userPoolId + clientId from
# Terraform outputs.
#
# PRD-52: set authDisabled=true to bypass auth entirely — every
# request is handled as a synthetic admin principal (dev@local).
# Use only when access control is handled upstream (VPN, Kubernetes
# RBAC, port-forward from a trusted client). NEVER combine with an
# internet-reachable ingress.
#
# When authDisabled=true, the Terraform deployment should also be
# run with `-var auth_enabled=false` to skip provisioning Cognito +
# ACM (and force ClusterIP ingress, which prevents accidentally
# exposing the auth-less control plane).
cognito:
  userPoolId: ""
  clientId: ""
  authDisabled: false

# -- Container registry (ECR pull-through cache for Docker Hub)
# When enabled, vLLM image pulls route through <account>.dkr.ecr.<region>.amazonaws.com/dockerhub/vllm/vllm-openai
# instead of docker.io/vllm/vllm-openai. Requires Terraform resources from PRD-29.
registry:
  pullThroughEnabled: false
  pullThroughURI: ""  # e.g. 820537372947.dkr.ecr.us-east-2.amazonaws.com
